    <script>
        // --- 1. QUESTION BANK (Add the remaining 90 questions here in this format) ---
        const questions = [
            {
                q: "Consider the following statements regarding the 'Parliamentary System' as envisioned in the Indian Constitution:<br><br>1. The doctrine of ministerial responsibility is explicitly codified in the Constitution for both the Union and the States.<br>2. Unlike the British Parliamentary system, the Indian Parliament is not a sovereign body.<br>3. The provision for a 'Shadow Cabinet' is structurally integrated into the Rules of Procedure of the Lok Sabha.<br><br>How many of the above statements are correct?",
                options: ["Only one", "Only two", "All three", "None"],
                answer: 1, // Index 1 = Only two
                exp: "Statement 1 is correct: Article 75 (Union) and Article 164 (States) explicitly codify the principle of collective ministerial responsibility to the lower house.<br>Statement 2 is correct: Indian Parliament is limited by a written Constitution, federal system, judicial review, and fundamental rights, unlike the sovereign British Parliament.<br>Statement 3 is incorrect: 'Shadow Cabinet' is a unique institution of the British cabinet system and has no structural integration or recognition in the Rules of Procedure of the Indian Parliament."
            },
            {
                q: "With reference to the 'Synthesis of Parliamentary Sovereignty and Judicial Supremacy' in India, consider the following statements:<br><br>1. The scope of judicial review in India is narrower than that of what exists in the US.<br>2. The Indian Constitution originally preferred 'due process of law' over 'procedure established by law' to check arbitrary legislative actions.<br>3. The Supreme Court can declare parliamentary laws unconstitutional, while Parliament can amend the major portion of the Constitution through Article 368.<br><br>Which of the statements given above is/are correct?",
                options: ["1 and 2 only", "2 and 3 only", "1 and 3 only", "1, 2 and 3"],
                answer: 2, // Index 2 = 1 and 3 only
                exp: "Statement 1 is correct: The scope of judicial review in India is narrower than the US because the American Constitution provides for 'due process of law' whereas the Indian Constitution relies on 'procedure established by law' (Art 21).<br>Statement 2 is incorrect: The framers explicitly chose 'procedure established by law' (borrowed from Japan) and rejected the American 'due process of law' to prevent the judiciary from becoming a super-legislature.<br>Statement 3 is correct: This establishes the synthesis—judiciary has review powers, while Parliament has amending powers (subject to basic structure)."
            },
            {
                q: "The Indian Constitution is described as a 'Federal System with Unitary Bias'. Which of the following features support this characterization?<br><br>1. Complete territorial integrity of the states against unilateral parliamentary action.<br>2. The presence of the All-India Services.<br>3. The appointment of the State Governor by the President.<br>4. The veto power of the President over certain state bills.<br><br>Select the correct answer using the code given below:",
                options: ["1, 2 and 3 only", "2, 3 and 4 only", "1, 3 and 4 only", "1, 2, 3 and 4"],
                answer: 1, // Index 1 = 2, 3 and 4 only
                exp: "Statement 1 is incorrect: States in India do not have territorial integrity. Article 3 allows Parliament to alter the boundaries or names of states without their binding consent, an inherently unitary feature.<br>Statement 2, 3, and 4 are correct: All-India Services violate the strict federal principle of divided administration. The Governor's appointment (Canadian model) and the Presidential veto on state bills (reserved by the Governor) represent strong centralizing (unitary) tendencies."
            },
            {
                q: "Consider the following statements regarding the 'Basic Structure Doctrine':<br><br>1. It was explicitly incorporated into the Constitution via the 42nd Amendment Act.<br>2. The doctrine implies that while fundamental rights can be amended, the underlying framework of the Constitution cannot be destroyed.<br>3. The 'Welfare State' and 'Effective access to justice' have been recognized as elements of the Basic Structure by the Supreme Court.<br><br>How many of the above statements are correct?",
                options: ["Only one", "Only two", "All three", "None"],
                answer: 1, // Index 1 = Only two
                exp: "Statement 1 is incorrect: The Basic Structure Doctrine is a judicial innovation (Kesavananda Bharati case, 1973) and is nowhere mentioned or incorporated via any constitutional amendment.<br>Statement 2 is correct: The core ruling of Kesavananda Bharati was that Parliament can amend any part, including Fundamental Rights, provided the basic structure is not altered.<br>Statement 3 is correct: Over time, subsequent judgements have added both 'Welfare State' and 'Effective access to justice' to the non-exhaustive list of basic structure elements."
            },
            {
                q: "Which of the following constitutional provisions reflect the 'Secular' nature of the Indian State?<br><br>1. The State shall not deny to any person equality before the law.<br>2. No religious instruction shall be provided in any educational institution wholly maintained out of State funds.<br>3. The State shall endeavor to secure for the citizens a Uniform Civil Code.<br>4. Any section of citizens with a distinct language, script, or culture shall have the right to conserve the same.<br><br>Select the correct answer using the code given below:",
                options: ["1 and 2 only", "2 and 3 only", "1, 2 and 3 only", "1, 2, 3 and 4"],
                answer: 3, // Index 3 = 1, 2, 3 and 4
                exp: "All four reflect secularism. <br>1. Article 14 (Equality before law) ensures no religious discrimination.<br>2. Article 28 prohibits religious instruction in State-funded institutions, ensuring state neutrality.<br>3. Article 44 (UCC) attempts to divorce personal laws from religion.<br>4. Article 29 (Cultural rights) protects minorities, which is central to the Indian model of positive secularism."
            },
            {
                q: "Assertion (A): The Indian Constitution is characterized as 'rigid' as well as 'flexible'.<br>Reason (R): Some provisions of the Constitution can be amended by a simple majority in Parliament, which does not fall under the purview of Article 368.<br><br>In the context of the above two statements, which one of the following is correct?",
                options: [
                    "Both A and R are true and R is the correct explanation of A",
                    "Both A and R are true but R is NOT the correct explanation of A",
                    "A is true but R is false",
                    "A is false but R is true"
                ],
                answer: 0, // Index 0
                exp: "Assertion is true. The Indian Constitution is a blend of rigidity and flexibility. Reason is also true and is the correct explanation. It is flexible because a large number of provisions can be amended by a simple majority (e.g., admitting new states, quorum in Parliament) outside Article 368. It is rigid because certain federal provisions require a special majority of Parliament plus ratification by half the state legislatures (under Art 368)."
            },
            {
                q: "Consider the following statements about the 'Universal Adult Franchise' in India:<br><br>1. It was adopted directly in the original Constitution without being subjected to a gradual phased implementation.<br>2. The voting age was reduced from 21 years to 18 years by the 61st Constitutional Amendment Act.<br>3. The provision of Universal Adult Franchise is guaranteed under Article 326 as a constitutional right, not a fundamental right.<br><br>Which of the statements given above are correct?",
                options: ["1 and 2 only", "2 and 3 only", "1 and 3 only", "1, 2 and 3"],
                answer: 3, // Index 3 = 1, 2 and 3
                exp: "Statement 1 is correct: Despite vast illiteracy and poverty, the framers took a bold step to introduce it immediately for all adults without phases.<br>Statement 2 is correct: The 61st CAA (1988) reduced the voting age to 18.<br>Statement 3 is correct: Article 326 guarantees that elections to the Lok Sabha and State Assemblies shall be on the basis of adult suffrage. It is a constitutional right, distinct from Part III fundamental rights."
            },
            {
                q: "With reference to the 'Independent Bodies' established by the Constitution to serve as bulwarks of the democratic system, consider the following:<br><br>1. The Comptroller and Auditor-General of India controls the issue of money from the Consolidated Fund of India.<br>2. The Election Commission is responsible for conducting elections to the Parliament, State Legislatures, and the offices of the President and Vice-President.<br>3. The expenses of the Union Public Service Commission are charged on the Consolidated Fund of India.<br><br>How many of the statements given above are correct?",
                options: ["Only one", "Only two", "All three", "None"],
                answer: 1, // Index 1 = Only two
                exp: "Statement 1 is incorrect: Unlike the CAG in Britain, the CAG of India does not control the issue of money. The CAG only audits accounts after the expenditure is made. Money can be drawn from the CFI without CAG approval.<br>Statement 2 is correct: Article 324 mandates the EC to conduct these specific elections (not local bodies).<br>Statement 3 is correct: To ensure independence, UPSC expenses are charged on the CFI and are not subject to parliamentary vote."
            },
            {
                q: "Regarding 'Single Citizenship' in India, consider the following statements:<br><br>1. The Constitution of India provides for single citizenship but allows states to provide special residential rights for employment under Article 16.<br>2. Overseas Citizen of India (OCI) cardholders possess political rights equivalent to Indian citizens but are exempt from paying taxes in India.<br>3. Only citizens by birth are eligible for the office of the President of India.<br><br>Which of the statements given above is/are correct?",
                options: ["1 only", "1 and 2 only", "3 only", "None"],
                answer: 0, // Index 0 = 1 only
                exp: "Statement 1 is correct: While India has single citizenship, Article 16(3) empowers Parliament (not state legislatures) to prescribe residence within a state as a condition for certain employments.<br>Statement 2 is incorrect: OCI cardholders do NOT have political rights (cannot vote or hold public office) and their tax liability depends on their residential status under the IT Act.<br>Statement 3 is incorrect: In India, a citizen by birth as well as a naturalized citizen is eligible for the President's office. (In the USA, only a citizen by birth is eligible)."
            },
            {
                q: "The Constitution of India balances the Fundamental Rights (FRs) and Directive Principles of State Policy (DPSPs). Which of the following judicial pronouncements established that the 'harmony and balance between FRs and DPSPs is an essential feature of the basic structure'?<br><br>1. Champakam Dorairajan Case (1951)<br>2. Golaknath Case (1967)<br>3. Kesavananda Bharati Case (1973)<br>4. Minerva Mills Case (1980)<br><br>Select the correct answer:",
                options: ["1", "2", "3", "4"],
                answer: 3, // Index 3 = 4 (Minerva Mills)
                exp: "In the Minerva Mills case (1980), the Supreme Court held that the Indian Constitution is founded on the bedrock of the balance between Fundamental Rights and the Directive Principles. Destroying this balance would destroy the basic structure of the Constitution. The other cases dealt with primacy, but Minerva Mills explicitly enshrined the 'balance' as a Basic Structure element."
            },
            {
                q: "Consider the following statements regarding the 'Objectives Resolution' adopted by the Constituent Assembly:<br><br>1. It explicitly contained the term 'Secular' to describe the future constitutional nature of the republic.<br>2. It guaranteed adequate safeguards for minorities, backward and tribal areas, and depressed and other backward classes.<br>3. It formed the philosophical bedrock upon which the Preamble of the Indian Constitution was drafted.<br><br>How many of the above statements are correct?",
                options: ["Only one", "Only two", "All three", "None"],
                answer: 1,
                exp: "Statement 1 is incorrect: The Objectives Resolution did not contain the term 'Secular'. The term was added to the Preamble much later by the 42nd Amendment Act in 1976. Statements 2 and 3 are correct: The resolution specifically mandated safeguards for minorities and backward classes, and its modified version ultimately became the Preamble."
            },
            {
                q: "The Indian Constitution embodies the concept of 'Asymmetric Federalism'. Which of the following constitutional provisions logically reflect this principle?<br><br>1. Article 371-A granting special status and specific immunities to Nagaland.<br>2. The existence of the Sixth Schedule for tribal areas in Assam, Meghalaya, Tripura, and Mizoram.<br>3. The methodology of representation of states in the Rajya Sabha under the Fourth Schedule.<br><br>Select the correct answer using the code given below:",
                options: ["1 and 2 only", "2 and 3 only", "1 and 3 only", "1, 2 and 3"],
                answer: 3,
                exp: "All three reflect asymmetric federalism. Statements 1 and 2 are clear examples of differential treatment to protect specific regional or tribal identities. Statement 3 is also correct: Unlike the US Senate which gives symmetric (equal) representation to all states (2 seats each), the Rajya Sabha allocates seats asymmetrically based on population, leading to unequal political weight among states."
            },
            {
                q: "Assertion (A): 'Constitutional Morality' requires strict adherence exclusively to the explicitly written text of the Constitution, leaving no room for subjective judicial interpretation.<br>Reason (R): The Supreme Court in the Sabarimala judgement invoked Constitutional Morality to strike down customary religious practices that violated fundamental rights.<br><br>In the context of the above two statements, which one is correct?",
                options: [
                    "Both A and R are true and R is the correct explanation of A",
                    "Both A and R are true but R is NOT the correct explanation of A",
                    "A is true but R is false",
                    "A is false but R is true"
                ],
                answer: 3,
                exp: "Assertion is false: Constitutional Morality is not restricted to the literal text; it encompasses implied constitutional values like pluralism, inclusion, fraternity, and dignity. It checks arbitrary power even if not explicitly written. Reason is true: The SC heavily relied on the doctrine of Constitutional Morality in the Sabarimala case to prioritize equality over exclusionary religious customs."
            },
            {
                q: "Consider the following statements regarding the 'Fundamental Duties' in the Indian Constitution:<br><br>1. They were added upon the recommendation of the Swaran Singh Committee, which originally suggested imposing penal provisions for their non-compliance.<br>2. The duty to 'strive towards excellence in all spheres of individual and collective activity' is applicable to citizens and resident aliens alike.<br>3. Parliament is constitutionally barred from enforcing any Fundamental Duty through direct legislation.<br><br>How many of the above statements are correct?",
                options: ["Only one", "Only two", "All three", "None"],
                answer: 0,
                exp: "Statement 1 is correct: The Swaran Singh Committee did suggest penal provisions, though the government of the time rejected that specific recommendation. Statement 2 is incorrect: Fundamental Duties (Part IVA) apply ONLY to Indian citizens, not aliens. Statement 3 is incorrect: The Supreme Court has clarified that Parliament CAN enforce duties through suitable legislation (e.g., Prevention of Insults to National Honour Act, 1971)."
            },
            {
                q: "Which of the following mechanisms demonstrate the constitutional 'Checks and Balances' within the Indian model of Separation of Powers?<br><br>1. Promulgation of Ordinances by the President under Article 123.<br>2. Judicial review of legislative enactments by the higher judiciary.<br>3. Parliamentary control over the executive through Adjournment and No-Confidence Motions.<br>4. Appointment of Supreme Court judges via the Collegium system without executive veto.<br><br>Select the correct answer:",
                options: ["1, 2 and 3 only", "2 and 3 only", "2, 3 and 4 only", "1, 2, 3 and 4"],
                answer: 0,
                exp: "Statements 1, 2, and 3 are correct examples of checks and balances (Executive exercising legislative power in emergencies, Judiciary checking Legislature, Legislature checking Executive). Statement 4 is incorrect: The Collegium system is a judicial innovation that minimizes the executive's check on the judiciary, skewing the intended constitutional balance rather than demonstrating a 'check and balance' designed by the framers."
            },
            {
                q: "Consider the following provisions of the Constitution:<br><br>1. Abolition or creation of Legislative Councils in States.<br>2. Representation of States in Parliament.<br>3. Power of Parliament to amend the Constitution and its procedure (Article 368).<br><br>Which of the above requires an amendment by a special majority of Parliament combined with the consent of half of the state legislatures?",
                options: ["1 and 2 only", "2 and 3 only", "3 only", "1, 2 and 3"],
                answer: 1,
                exp: "Statement 1 is incorrect: Article 169 (creation/abolition of legislative councils) requires only a simple majority in Parliament and is explicitly stated not to be deemed an amendment under Article 368. Statements 2 and 3 are correct: Altering state representation (Schedule 4) and amending Article 368 itself directly alter the federal balance and require state ratification."
            },
            {
                q: "The concept of 'Rule of Law' as propounded by A.V. Dicey includes specific elements. How many of these original elements are fully applicable in the Indian legal system?<br><br>1. Absence of arbitrary power.<br>2. Equality before the law.<br>3. The primacy of the rights of the individual as the source of the Constitution.<br><br>Select the correct statement:",
                options: [
                    "All three elements are applicable in India.",
                    "Only 1 and 2 are applicable in India.",
                    "Only 2 and 3 are applicable in India.",
                    "None of the elements apply due to immunities under Article 361."
                ],
                answer: 1,
                exp: "Dicey's concept has three core elements. The first two (absence of arbitrary power and equality before the law) apply in India and form the basis of Article 14. The third element (the Constitution is the result of individual rights defined by courts) does NOT apply in India. In India, the written Constitution is the source of individual rights, not the outcome of judicial decisions as in the unwritten UK system."
            },
            {
                q: "Consider the following statements regarding the Directive Principles of State Policy (DPSP):<br><br>1. The framers of the Indian Constitution borrowed this concept directly from the Spanish Constitution.<br>2. They conceptually resemble the 'Instrument of Instructions' enumerated in the Government of India Act of 1935.<br>3. The Supreme Court has established that DPSPs are subservient to Fundamental Rights in all cases of conflict without exception.<br><br>How many of the above statements are correct?",
                options: ["Only one", "Only two", "All three", "None"],
                answer: 0,
                exp: "Statement 1 is incorrect: India borrowed the concept from the Irish Constitution (which in turn had borrowed it from Spain). Statement 2 is correct: Dr. B.R. Ambedkar equated DPSPs with the Instrument of Instructions. Statement 3 is incorrect: Under Article 31C, laws implementing DPSPs 39(b) and 39(c) take precedence over Fundamental Rights 14 and 19. Hence, they are not subservient in *all* cases."
            },
            {
                q: "With reference to the Preamble of the Indian Constitution, which of the following statements is/are factually accurate based on its exact text?<br><br>1. It secures five specific types of liberty and three distinct types of justice.<br>2. It was adopted, enacted, and given to themselves by the 'People of India' on 26th January 1950.<br>3. 'Fraternity' assures the dignity of the individual and the unity and integrity of the Nation.<br><br>Select the correct answer:",

        // --- 2. STATE MANAGEMENT ---
        let currentQ = 0;
        let userAnswers = new Array(questions.length).fill(null);
        // 0: Unvisited, 1: Visited, 2: Answered, 3: Marked, 4: Marked & Answered
        let qStatus = new Array(questions.length).fill(0); 
        qStatus[0] = 1; // First question visited immediately

        let timeLeft = 7200; // 2 hours in seconds
        let timerInterval;

        // --- 3. INITIALIZATION ---
        window.onload = () => {
            initPalette();
            loadQuestion(0);
            startTimer();
        };

        function startTimer() {
            const timerEl = document.getElementById('timer');
            timerInterval = setInterval(() => {
                if(timeLeft <= 0) {
                    clearInterval(timerInterval);
                    submitExam();
                } else {
                    timeLeft--;
                    let h = Math.floor(timeLeft / 3600).toString().padStart(2, '0');
                    let m = Math.floor((timeLeft % 3600) / 60).toString().padStart(2, '0');
                    let s = (timeLeft % 60).toString().padStart(2, '0');
                    timerEl.innerText = `${h}:${m}:${s}`;
                }
            }, 1000);
        }

        // --- 4. QUESTION RENDERING ---
        function loadQuestion(index) {
            currentQ = index;
            document.getElementById('q-no').innerText = `Question ${index + 1} of ${questions.length}`;
            document.getElementById('q-text').innerHTML = questions[index].q;
            
            const optionsBox = document.getElementById('options-box');
            optionsBox.innerHTML = '';
            
            questions[index].options.forEach((opt, i) => {
                const checked = userAnswers[index] === i ? 'checked' : '';
                optionsBox.innerHTML += `
                    <label class="option-label">
                        <input type="radio" name="option" value="${i}" ${checked} onchange="selectOption(${i})">
                        <span>${opt}</span>
                    </label>
                `;
            });

            if (qStatus[index] === 0) qStatus[index] = 1;
            updatePalette();
        }

        function selectOption(optIndex) {
            userAnswers[currentQ] = optIndex;
        }

        // --- 5. NAVIGATION LOGIC ---
        function updateStatusOnNext() {
            if (userAnswers[currentQ] !== null) {
                if (qStatus[currentQ] !== 4) qStatus[currentQ] = 2; // Answered
            } else {
                if (qStatus[currentQ] !== 3) qStatus[currentQ] = 1; // Visited (Not answered)
            }
        }

        function nextQuestion() {
            updateStatusOnNext();
            if (currentQ < questions.length - 1) {
                loadQuestion(currentQ + 1);
            } else {
                updatePalette();
            }
        }

        function prevQuestion() {
            updateStatusOnNext();
            if (currentQ > 0) loadQuestion(currentQ - 1);
        }

        function markForReview() {
            if (userAnswers[currentQ] !== null) {
                qStatus[currentQ] = 4; // Answered & Marked
            } else {
                qStatus[currentQ] = 3; // Marked
            }
            if (currentQ < questions.length - 1) {
                loadQuestion(currentQ + 1);
            } else {
                updatePalette();
            }
        }

        function jumpToQuestion(index) {
            updateStatusOnNext();
            loadQuestion(index);
        }

        // --- 6. PALETTE LOGIC ---
        function initPalette() {
            const palette = document.getElementById('palette');
            palette.innerHTML = '';
            for(let i=0; i<questions.length; i++) {
                palette.innerHTML += `<div class="palette-btn" id="pbtn-${i}" onclick="jumpToQuestion(${i})">${i+1}</div>`;
            }
        }

        function updatePalette() {
            for(let i=0; i<questions.length; i++) {
                const btn = document.getElementById(`pbtn-${i}`);
                btn.className = 'palette-btn'; // Reset
                if(i === currentQ) btn.style.border = '2px solid black';
                else btn.style.border = '1px solid var(--border)';

                if(qStatus[i] === 0) btn.classList.add('status-unvisited');
                else if(qStatus[i] === 1) btn.classList.add('status-visited');
                else if(qStatus[i] === 2) btn.classList.add('status-answered');
                else if(qStatus[i] === 3) btn.classList.add('status-marked');
                else if(qStatus[i] === 4) btn.classList.add('status-marked-answered');
            }
        }

        // --- 7. SUBMIT & EVALUATE ---
        function submitExam() {
            if(timeLeft > 0) {
                if(!confirm("Are you sure you want to submit the exam?")) return;
            }
            
            clearInterval(timerInterval);
            document.getElementById('quiz-interface').style.display = 'none';
            
            let correct = 0;
            let incorrect = 0;
            let attempted = 0;

            const reviewHtml = [];

            for(let i=0; i<questions.length; i++) {
                const uAns = userAnswers[i];
                const cAns = questions[i].answer;
                
                let statusText = "";
                if(uAns !== null) {
                    attempted++;
                    if(uAns === cAns) {
                        correct++;
                        statusText = `<div class="user-ans user-correct">Your Answer: ${questions[i].options[uAns]} (Correct)</div>`;
                    } else {
                        incorrect++;
                        statusText = `<div class="user-ans user-wrong">Your Answer: ${questions[i].options[uAns]} (Incorrect)</div>`;
                    }
                } else {
                    statusText = `<div class="user-ans" style="color: grey;">Unattempted</div>`;
                }

                reviewHtml.push(`
                    <div class="review-question">
                        <h4>Question ${i+1}</h4>
                        <div style="margin-top: 0.5rem;">${questions[i].q}</div>
                        ${statusText}
                        <div class="correct-ans">Correct Answer: ${questions[i].options[cAns]}</div>
                        <div class="explanation-box">
                            <strong>Explanation:</strong><br>${questions[i].exp}
                        </div>
                    </div>
                `);
            }

            const totalScore = (correct * 2) - (incorrect * 0.66);
            const accuracy = attempted > 0 ? ((correct / attempted) * 100).toFixed(2) : 0;

            document.getElementById('final-score').innerText = `${totalScore.toFixed(2)} / ${questions.length * 2}`;
            document.getElementById('final-attempted').innerText = `${attempted} / ${questions.length}`;
            document.getElementById('final-accuracy').innerText = `${accuracy}%`;
            
            document.getElementById('review-content').innerHTML = reviewHtml.join('');
            document.getElementById('result-screen').style.display = 'block';
        }
    </script>
