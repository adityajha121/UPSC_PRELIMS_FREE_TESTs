let currentQuestion = 0;
let userAnswers = new Array(questions.length).fill(null);
let reviewMarked = new Array(questions.length).fill(false);

function loadQuestion(index){

let q = questions[index];

document.getElementById("questionNumber").innerHTML =
`Question ${index+1} of ${questions.length}`;

document.getElementById("questionText").innerHTML = q.q;

let optionsHTML = "";

q.options.forEach((option,i)=>{

optionsHTML += `
<label class="option">
<input type="radio"
name="answer"
value="${i}"
${userAnswers[index]===i ? "checked" : ""}>
${option}
</label>
`;

});

document.getElementById("optionsContainer").innerHTML =
optionsHTML;

updatePalette();

document
.querySelectorAll('input[name="answer"]')
.forEach(input=>{

input.addEventListener('change',function(){

userAnswers[index]=parseInt(this.value);

updatePalette();

});

});

document.getElementById("explanation").style.display="none";

}

function nextQuestion(){

if(currentQuestion<questions.length-1){

currentQuestion++;

loadQuestion(currentQuestion);

}

}

function prevQuestion(){

if(currentQuestion>0){

currentQuestion--;

loadQuestion(currentQuestion);

}

}

function markReview(){

reviewMarked[currentQuestion]=true;

updatePalette();

}

function updatePalette(){

const palette=document.getElementById("palette");

palette.innerHTML="";

questions.forEach((q,index)=>{

let cls="";

if(reviewMarked[index])
cls="reviewed";

else if(userAnswers[index]!==null)
cls="answered";

palette.innerHTML+=`
<button class="${cls}"
onclick="gotoQuestion(${index})">
${index+1}
</button>
`;

});

}

function gotoQuestion(index){

currentQuestion=index;

loadQuestion(index);

}

function submitQuiz(){

let score=0;

let correct=0;
let wrong=0;

questions.forEach((q,index)=>{

if(userAnswers[index]===q.answer){

score+=2;
correct++;

}

else if(userAnswers[index]!==null){

score-=0.66;
wrong++;

}

});

let unanswered=
questions.length-correct-wrong;

alert(
`Quiz Submitted

Correct : ${correct}

Wrong : ${wrong}

Unanswered : ${unanswered}

Score : ${score.toFixed(2)} / 200`
);

showExplanation();

}

function showExplanation(){

let expDiv=
document.getElementById("explanation");

expDiv.style.display="block";

expDiv.innerHTML=
`
<b>Correct Answer:</b>
${questions[currentQuestion]
.options[
questions[currentQuestion]
.answer
]}
<br><br>

<b>Explanation:</b><br>
${questions[currentQuestion].exp}
`;

}

let totalSeconds=7200;

setInterval(()=>{

let hrs=Math.floor(totalSeconds/3600);

let mins=Math.floor(
(totalSeconds%3600)/60
);

let secs=totalSeconds%60;

document.getElementById("timer")
.innerHTML=

String(hrs).padStart(2,'0')
+":"
+String(mins).padStart(2,'0')
+":"
+String(secs).padStart(2,'0');

if(totalSeconds>0){

totalSeconds--;

}else{

submitQuiz();

}

},1000);

loadQuestion(0);

</script>
