// State variables
let currentQuestion = 0;
let selectedOptions = new Array(allQuestions.length).fill(null);
let qStatus = new Array(allQuestions.length).fill('not-visited'); 
qStatus[0] = 'not-answered'; 

let timeLeft = 2 * 60 * 60; // 2 hours in seconds
let timerInterval;

// DOM Elements
const qNumberEl = document.getElementById('q-number');
const qTextEl = document.getElementById('q-text');
const optionsContainer = document.getElementById('options-container');
const paletteContainer = document.getElementById('q-palette');

function init() {
    renderPalette();
    renderQuestion(0);
    startTimer();
}

function startTimer() {
    timerInterval = setInterval(() => {
        if(timeLeft <= 0) {
            clearInterval(timerInterval);
            submitExam();
            return;
        }
        timeLeft--;
        const h = String(Math.floor(timeLeft / 3600)).padStart(2, '0');
        const m = String(Math.floor((timeLeft % 3600) / 60)).padStart(2, '0');
        const s = String(timeLeft % 60).padStart(2, '0');
        document.getElementById('timer').innerText = `${h}:${m}:${s}`;
    }, 1000);
}

function renderPalette() {
    paletteContainer.innerHTML = '';
    for(let i = 0; i < allQuestions.length; i++) {
        const btn = document.createElement('div');
        btn.className = `q-btn bg-${qStatus[i]}`;
        btn.innerText = i + 1;
        btn.onclick = () => jumpToQuestion(i);
        paletteContainer.appendChild(btn);
    }
}

function renderQuestion(index) {
    currentQuestion = index;
    const q = allQuestions[index];
    qNumberEl.innerText = `Question ${index + 1} of ${allQuestions.length}`;
    qTextEl.innerText = q.q;
    
    optionsContainer.innerHTML = '';
    q.options.forEach((opt, i) => {
        const optDiv = document.createElement('div');
        optDiv.className = 'option-item';
        optDiv.onclick = () => selectOption(i);
        
        const radio = document.createElement('input');
        radio.type = 'radio';
        radio.name = 'option';
        radio.checked = selectedOptions[index] === i;
        
        const label = document.createElement('span');
        label.innerText = opt;
        
        optDiv.appendChild(radio);
        optDiv.appendChild(label);
        optionsContainer.appendChild(optDiv);
    });

    if (qStatus[index] === 'not-visited') {
        qStatus[index] = 'not-answered';
        updatePaletteColors();
    }
}

function selectOption(optIndex) {
    selectedOptions[currentQuestion] = optIndex;
    renderQuestion(currentQuestion); // re-render to show selection
}

function updatePaletteColors() {
    const btns = paletteContainer.children;
    for(let i = 0; i < allQuestions.length; i++) {
        btns[i].className = `q-btn bg-${qStatus[i]}`;
        if(i === currentQuestion) {
            btns[i].style.border = "2px solid #000";
        } else {
            btns[i].style.border = "1px solid #ccc";
        }
    }
}

function jumpToQuestion(index) {
    renderQuestion(index);
    updatePaletteColors();
}

function handlePrevious() {
    if (currentQuestion > 0) {
        jumpToQuestion(currentQuestion - 1);
    }
}

function handleSaveNext() {
    if (selectedOptions[currentQuestion] !== null) {
        qStatus[currentQuestion] = 'answered';
    } else {
        qStatus[currentQuestion] = 'not-answered';
    }
    if (currentQuestion < allQuestions.length - 1) {
        jumpToQuestion(currentQuestion + 1);
    } else {
        updatePaletteColors(); 
    }
}

function handleMarkReview() {
    if (selectedOptions[currentQuestion] !== null) {
        qStatus[currentQuestion] = 'marked-ans';
    } else {
        qStatus[currentQuestion] = 'marked';
    }
    if (currentQuestion < allQuestions.length - 1) {
        jumpToQuestion(currentQuestion + 1);
    } else {
        updatePaletteColors();
    }
}

function submitExam() {
    clearInterval(timerInterval);
    if(!confirm("Are you sure you want to submit the exam?")) return;

    document.getElementById('exam-ui').classList.add('hide');
    const resultsUi = document.getElementById('results-ui');
    resultsUi.style.display = 'block';

    let correct = 0;
    let incorrect = 0;
    let unattempted = 0;

    const expContainer = document.getElementById('explanations-container');
    expContainer.innerHTML = '';

    for (let i = 0; i < allQuestions.length; i++) {
        const userAns = selectedOptions[i];
        const actualAns = allQuestions[i].answer;
        
        let isAttempted = (userAns !== null); 
        
        if (isAttempted) {
            if (userAns === actualAns) correct++;
            else incorrect++;
        } else {
            unattempted++;
        }

        const expDiv = document.createElement('div');
        expDiv.style.marginBottom = "30px";
        expDiv.style.borderBottom = "1px solid #eee";
        expDiv.style.paddingBottom = "15px";
        
        let ansStatusTxt = isAttempted ? (userAns === actualAns ? '<span class="correct-ans">Correct</span>' : '<span class="wrong-ans">Incorrect</span>') : '<span>Unattempted</span>';
        
        expDiv.innerHTML = `
            <h3>Question ${i + 1} (${ansStatusTxt})</h3>
            <p style="white-space: pre-wrap; margin: 10px 0;"><strong>Q:</strong> ${allQuestions[i].q}</p>
            <p><strong>Correct Answer:</strong> ${allQuestions[i].options[actualAns]}</p>
            ${isAttempted ? `<p><strong>Your Answer:</strong> ${allQuestions[i].options[userAns]}</p>` : ''}
            <div class="explanation-box">
                <strong>Explanation:</strong><br>
                <span style="white-space: pre-wrap;">${allQuestions[i].exp}</span>
            </div>
        `;
        expContainer.appendChild(expDiv);
    }

    const totalAttempted = correct + incorrect;
    const totalScore = (correct * 2) - (incorrect * 0.66);
    const accuracy = totalAttempted === 0 ? 0 : Math.round((correct / totalAttempted) * 100);

    document.getElementById('score-card').innerHTML = `
        <h2>Final Score: ${totalScore.toFixed(2)} / ${allQuestions.length * 2}</h2>
        <div style="display: flex; gap: 30px; margin-top: 15px; font-size: 1.1rem;">
            <div><strong>Attempted:</strong> ${totalAttempted}</div>
            <div><strong class="correct-ans">Correct:</strong> ${correct}</div>
            <div><strong class="wrong-ans">Incorrect:</strong> ${incorrect}</div>
            <div><strong>Accuracy:</strong> ${accuracy}%</div>
        </div>
    `;
}

// Initialize on load
window.onload = init;


        </script>
