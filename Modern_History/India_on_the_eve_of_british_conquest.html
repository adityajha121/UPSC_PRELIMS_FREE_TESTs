    <script>
        const questions = [
            {
                q: "Consider the following statements regarding the 'Jagirdari Crisis' which contributed to the decline of the Mughal Empire:\n<br><br>1. The crisis was primarily rooted in a demographic mismatch, where the number of amirs (nobles) grew exponentially without a proportional increase in the Khalisa (crown) lands.\n<br>2. Aurangzeb’s prolonged Deccan campaigns definitively resolved the crisis by subsuming the rich fertile tracts of Bijapur and Golconda into the Khalisa.\n<br>3. The widespread institutionalization of 'Ijaradari' (revenue farming) in the 18th century was an administrative symptom of nobles attempting to extract maximum rent from shrinking jagirs.\n<br><br>How many of the above statements are correct?",
                options: ["Only one", "Only two", "All three", "None"],
                answer: 1,
                exp: "<b>Answer: Only two</b><br><br><b>Statement 1 is correct:</b> The Jagirdari crisis was fundamentally an economic and administrative mismatch. The number of mansabdars increased, but there was a shortage of 'paibaqi' (land available for assignment).<br><b>Statement 2 is incorrect:</b> Aurangzeb's Deccan campaigns exacerbated the crisis. Instead of keeping the newly conquered lands of Bijapur and Golconda as Khalisa to enrich the state treasury, he distributed them as jagirs to accommodate the influx of Deccani nobles (Marathas and nobles of conquered states), leaving the core problem unsolved and ruining agriculture through constant warfare.<br><b>Statement 3 is correct:</b> Ijaradari (revenue farming) became a widespread practice in the 18th century. Jagirdars, unsure of their tenure, turned to contractors (ijaradars) to squeeze maximum revenue, ruining the peasantry."
            },
            {
                q: "Regarding the socio-economic conditions in 18th century India, consider the following statements:\n<br><br>1. Despite the political fragmentation, India’s share in the global manufacturing output remained substantial, driven heavily by the export of cotton textiles and raw silk.\n<br>2. The 'Hundi' system of bills of exchange experienced a complete collapse due to the lack of centralized Mughal imperial backing along the trade routes.\n<br>3. The 18th-century regional states heavily patronized mercantilist policies, actively discouraging the settlement of European trading companies to protect indigenous merchants.\n<br><br>How many of the above statements are correct?",
                options: ["Only one", "Only two", "All three", "None"],
                answer: 0,
                exp: "<b>Answer: Only one</b><br><br><b>Statement 1 is correct:</b> Historians note that despite political decline, economic collapse did not immediately follow. India remained a major global manufacturing hub, particularly in textiles.<br><b>Statement 2 is incorrect:</b> The 'Hundi' system did not collapse; in fact, indigenous banking networks (like the Jagat Seths in Bengal) thrived and financed regional states and European companies alike. Credit systems adapted to regionalization.<br><b>Statement 3 is incorrect:</b> Regional powers did not inherently discourage European companies. Rulers like the Nawabs of Bengal and Awadh often encouraged European trade for bullion influx, though they tried (and eventually failed) to regulate their political interference."
            },
            {
                q: "Consider the following statements regarding the administration of the Maratha Confederacy in the 18th century:\n<br><br>1. The collection of 'Chauth' structurally integrated the subjugated territories into the core administrative framework of the Maratha Swarajya.\n<br>2. The Saranjami system, similar to the Mughal Jagirdari system, was heavily relied upon by the Peshwas to remunerate military commanders.\n<br>3. The transition of the Maratha state from a kingdom to a confederacy was formalized under the reign of Chhatrapati Shahu to accommodate the rising power of the Peshwas and regional chieftains.\n<br><br>How many of the above statements are correct?",
                options: ["Only one", "Only two", "All three", "None"],
                answer: 1,
                exp: "<b>Answer: Only two</b><br><br><b>Statement 1 is incorrect:</b> Chauth was effectively a military tribute (25% of revenue) paid to avoid Maratha raids. It did NOT integrate the territory into the Maratha administration (Swarajya); it merely established a sphere of influence, which alienated local populations and rulers.<br><b>Statement 2 is correct:</b> The Saranjami system was a land grant system for military service, analogous to the Jagirdari system, heavily utilized by the Peshwas to maintain the confederacy's armies.<br><b>Statement 3 is correct:</b> Chhatrapati Shahu formalized the confederacy system. Realizing he couldn't centrally control the expanding empire, he delegated vast autonomous powers to the Peshwa and regional commanders (Scindia, Holkar, Gaekwad, Bhonsle), transforming a centralized kingdom into a confederacy."
            },
            {
                q: "Assertion (A): The European trading companies transitioned from mere mercantilist entities to territorial powers in India by the mid-18th century.<br><br>Reason (R): The total absence of standing armies and modern artillery among the regional Indian states left a vacuum easily exploited by European coastal fortifications.\n<br><br>In the context of the above, which of the following is correct?",
                options: [
                    "Both A and R are true and R is the correct explanation of A.",
                    "Both A and R are true but R is not the correct explanation of A.",
                    "A is true but R is false.",
                    "A is false but R is true."
                ],
                answer: 2,
                exp: "<b>Answer: A is true but R is false.</b><br><br><b>Assertion is true:</b> By the 1750s, companies like the English East India Company and French East India Company shifted from trade to securing territorial revenues (e.g., Carnatic Wars, Battle of Plassey) to finance their investments.<br><b>Reason is false:</b> It is incorrect to state there was a 'total absence' of standing armies or artillery among Indian states. Powers like Mysore, the Marathas, and Awadh possessed large armies and heavily imported/manufactured modern artillery (often employing European mercenaries). The European advantage lay not in the absence of Indian armies, but in superior military discipline, regular pay, infantry squares, and unified command structures."
            },
            {
                q: "Consider the following pairs regarding regional powers of the 18th century and their administrative features:\n<br><br>1. Bengal (Murshid Quli Khan) : Introduction of the 'Ijara' system to strictly enforce fixed revenue demands.\n<br>2. Awadh (Saadat Khan) : Implementation of a fresh revenue settlement and suppression of rebellious zamindars.\n<br>3. Hyderabad (Nizam-ul-Mulk) : Complete abolition of the Mughal Mansabdari system to sever ties with Delhi.\n<br><br>How many pairs given above are correctly matched?",
                options: ["Only one", "Only two", "All three", "None"],
                answer: 1,
                exp: "<b>Answer: Only two</b><br><br><b>Pair 1 is correctly matched:</b> Murshid Quli Khan reformed Bengal's finances by removing jagirdars, converting lands to Khalisa, and extensively utilizing the 'Ijara' (revenue farming) system to ensure fixed revenue.<br><b>Pair 2 is correctly matched:</b> Saadat Khan Burhan-ul-Mulk suppressed local rebellious zamindars and carried out a fresh, more equitable revenue settlement to stabilize Awadh.<br><b>Pair 3 is incorrectly matched:</b> Nizam-ul-Mulk Asaf Jah did NOT abolish the Mansabdari system. He actually continued the Mughal administrative systems (mansab and jagir) in the Deccan, despite acting as an independent ruler in practice. He never officially severed suzerain ties with the Mughal Emperor."
            },
            {
                q: "With reference to the development of regional cultures in the 18th century (the so-called 'Dark Age'), consider the following statements:\n<br><br>1. The period witnessed a catastrophic decline in literary outputs as Persian lost royal patronage without a viable vernacular replacement.\n<br>2. The emergence of the Kangra and Rajput schools of miniature painting was a direct result of artists migrating from the declining Mughal court.\n<br>3. Urdu emerged as the language of elite poetry and literature primarily in the Deccan before gaining prominence in Northern India.\n<br><br>How many of the above statements are correct?",
                options: ["Only one", "Only two", "All three", "None"],
                answer: 1,
                exp: "<b>Answer: Only two</b><br><br><b>Statement 1 is incorrect:</b> The 18th century was not a cultural 'Dark Age'. While Persian lost centralized patronage, vernacular languages (Urdu, Bengali, Marathi, Sindhi) experienced a massive renaissance and literary output actually flourished at regional courts.<br><b>Statement 2 is correct:</b> As the Mughal court lost its wealth, master painters migrated to regional courts (Awadh, Rajputana, Punjab Hills), leading to the brilliant flowering of the Kangra, Pahari, and distinct Rajput schools of painting.<br><b>Statement 3 is correct:</b> Urdu (Rekhta) first developed into a sophisticated literary language in the Deccan courts (under poets like Wali Deccani) before being heavily adopted in Delhi and Lucknow in the 18th century."
            },
            {
                q: "Consider the following statements concerning the Kingdom of Mysore under Haidar Ali and Tipu Sultan:\n<br><br>1. Tipu Sultan recognized the importance of naval power and established a Board of Admiralty alongside naval dockyards.\n<br>2. Mysore was heavily dependent on the Jagirdari system, completely delegating revenue collection to local Poligars.\n<br>3. Tipu Sultan attempted to bypass European monopolies by establishing direct trade embassies in Pegu, Oman, and France.\n<br><br>How many of the above statements are correct?",
                options: ["Only one", "Only two", "All three", "None"],
                answer: 1,
                exp: "<b>Answer: Only two</b><br><br><b>Statement 1 is correct:</b> Tipu Sultan was unique among Indian rulers for understanding naval power. He created a Board of Admiralty and established dockyards at Mangalore, Wajedabad, and Molidabad.<br><b>Statement 2 is incorrect:</b> Mysore heavily centralized its administration. Haidar Ali and Tipu Sultan actively suppressed the autonomous local chiefs (Poligars), eliminated the jagir system, and paid their army directly in cash to maintain absolute control over state resources.<br><b>Statement 3 is correct:</b> Tipu Sultan acted like a modern mercantilist state. He established a state commercial board and sent embassies to France, Turkey, Iran, and Pegu to establish direct trade and bypass the East India Company."
            },
            {
                q: "Consider the following statements regarding the Sikh Misls in the late 18th century:\n<br><br>1. The Misls were purely military brotherhoods devoid of any territorial administrative framework.\n<br>2. The system of 'Rakhi' was instituted by the Misls to offer protection to cultivators against external raids in exchange for a portion of their yield.\n<br>3. The unified central authority of the Dal Khalsa completely superseded the autonomy of individual Misl chiefs during peacetime.\n<br><br>How many of the above statements are correct?",
                options: ["Only one", "Only two", "All three", "None"],
                answer: 0,
                exp: "<b>Answer: Only one</b><br><br><b>Statement 1 is incorrect:</b> While initially military bands, as they captured territory, the Misls evolved into complex territorial administrations. They minted coins, collected revenue, and administered justice within their domains.<br><b>Statement 2 is correct:</b> The 'Rakhi' system was a protection tax (usually 20% of the yield) levied by the Misls on villages. In return, the Misl guaranteed protection against Afghan invasions and other raiders.<br><b>Statement 3 is incorrect:</b> The Dal Khalsa was a unified military command during times of external threat (like Afghan invasions). During peacetime, individual Misl chiefs fiercely guarded their autonomy, often fighting amongst themselves. There was no overarching centralized civil authority until Ranjit Singh."
            },
            {
                q: "Analyze the structural weaknesses of the Indian states that facilitated the British conquest. Which of the following statements represents the most fundamental difference between the British East India Company (EIC) and the regional Indian states?\n<br><br>1. The EIC possessed an uninterrupted corporate continuity that insulated it from the dynastic succession wars plaguing Indian states.\n<br>2. Indian states exclusively relied on archaic cavalry tactics while completely ignoring the integration of infantry or artillery.\n<br>3. The EIC’s military conquests were organically financed by the booming industrial revolution in Britain during the mid-18th century.\n<br><br>How many of the above statements are correct?",
                options: ["Only one", "Only two", "All three", "None"],
                answer: 0,
                exp: "<b>Answer: Only one</b><br><br><b>Statement 1 is correct:</b> The EIC was a joint-stock company with corporate governance. Unlike Indian regional states, where the death of a ruler (e.g., Aurangzeb, Peshwa Madhavrao) led to devastating succession wars and institutional collapse, the EIC's leadership was seamlessly replaced via bureaucratic processes.<br><b>Statement 2 is incorrect:</b> Indian states did not ignore infantry or artillery. Marathas (under Mahadji Sindhia) and Mysore established highly modernized infantry and artillery units trained by European mercenaries. The British advantage was in discipline, regular pay, and unified command, not just the mere presence of artillery.<br><b>Statement 3 is incorrect:</b> The EIC's initial conquests in India (1750s-1780s) were NOT financed by the British Industrial Revolution. In fact, it was the other way around; the EIC financed its military expansion using the land revenues of Bengal (plundered after Plassey/Buxar), making the conquest self-financing."
            },
            {
                q: "Consider the following regarding the early European powers in India:\n<br><br>1. The Portuguese 'Cartaz' system was an early manifestation of naval supremacy, forcing Asian ships to purchase protection passes in the Indian Ocean.\n<br>2. The Dutch East India Company focused heavily on building a massive territorial empire in India to counter the British.\n<br>3. The French East India Company suffered strategically because it was highly dependent on the whims of the French monarchy, lacking the autonomy of the British EIC.\n<br><br>How many of the above statements are correct?",
                options: ["Only one", "Only two", "All three", "None"],
                answer: 1,
                exp: "<b>Answer: Only two</b><br><br><b>Statement 1 is correct:</b> The Portuguese enforced the Cartaz system using their naval superiority, monopolizing the spice routes and taxing local maritime trade in the 16th century.<br><b>Statement 2 is incorrect:</b> The Dutch primarily focused on the Spice Islands (modern-day Indonesia). In India, their interest was strictly commercial (Coromandel textiles to trade for spices), and they actively avoided costly territorial empire-building in India, unlike the British and French.<br><b>Statement 3 is correct:</b> The French Compagnie des Indes was essentially a state department controlled by the French monarch, suffering from bureaucratic delays and lack of commercial motivation. The British EIC was a private joint-stock company driven by shareholder profit, making it vastly more dynamic and autonomous."
            },
            {
                q: "Regarding the 'Third Battle of Panipat' (1761), consider the following statements:\n<br><br>1. The defeat conclusively shattered the Maratha ambition of replacing the Mughal Empire and directly paved the way for the British acquisition of Bengal.\n<br>2. The Marathas failed to secure alliances with the Rajputs and Jats due to their previous predatory policies in North India.\n<br>3. Sadashivrao Bhau completely abandoned the traditional Maratha guerrilla tactics in favor of pitched European-style artillery warfare.\n<br><br>How many of the above statements are correct?",
                options: ["Only one", "Only two", "All three", "None"],
                answer: 1,
                exp: "<b>Answer: Only two</b><br><br><b>Statement 1 is incorrect:</b> While Panipat was a disaster for the Marathas, it did not directly pave the way for the British in Bengal (Plassey happened in 1757, before Panipat). Historians argue Panipat decided 'who would not rule India' rather than who would. The Marathas resurrected their power under Madhavrao within a decade.<br><b>Statement 2 is correct:</b> The Marathas' incessant demands for Chauth and political interference alienated the Rajputs, Jats (Suraj Mal withdrew his support), and Awadh (Shuja-ud-Daula joined Abdali), leaving the Marathas without local allies.<br><b>Statement 3 is correct:</b> Sadashivrao Bhau relied heavily on his modernized artillery (Ibrahim Khan Gardi). He entrenched his forces in Panipat, discarding the highly mobile, hit-and-run cavalry tactics (Bargigiri) that had originally made the Marathas invincible."
            },
            {
                q: "In the context of land revenue systems on the eve of the British conquest, the term 'Taluqdar' in Awadh primarily referred to:\n<br><br>1. Hereditary clan chiefs who controlled massive rural estates and forts, acting as an intermediary layer of agrarian power.\n<br>2. Imperial bureaucrats appointed directly by the Mughal Emperor to audit the accounts of the Nawab of Awadh.\n<br>3. Portuguese merchants who secured exclusive land grants for cultivating cash crops like indigo.\n<br><br>Which of the statements given above is/are correct?",
                options: ["1 only", "2 only", "1 and 3 only", "1, 2 and 3"],
                answer: 0,
                exp: "<b>Answer: 1 only</b><br><br>In Awadh, the Taluqdars were powerful local aristocrats and clan chiefs. As the central Mughal authority waned, these local elites fortified their positions, built forts, and maintained private militias. They acted as powerful intermediaries between the cultivating peasantry and the Nawab's state. They were certainly not imperial auditors or Portuguese merchants."
            },
            {
                q: "Assertion (A): The 'Dual Government' established by Robert Clive in Bengal (1765) separated power from responsibility.\n<br><br>Reason (R): The East India Company secured the Diwani (revenue) rights but deliberately left the Nizamat (law and order) in the hands of the powerless Nawab.\n<br><br>In the context of the above, which of the following is correct?",
                options: [
                    "Both A and R are true and R is the correct explanation of A.",
                    "Both A and R are true but R is not the correct explanation of A.",
                    "A is true but R is false.",
                    "A is false but R is true."

                exp: "<b>Answer: All three</b><br><br><b>Statement 1 is correct:</b> The Treaty of Madras (1769) forced by Haidar Ali on the British, included mutual restitution of territories and a defensive alliance (which the British later violated).<br><b>Statement 2 is correct:</b> Haidar Ali was a master diplomat. In 1780, he forged a powerful triple alliance with the Marathas and the Nizam against the British, though the British (Warren Hastings) managed to detach them later.<br><b>Statement 3 is correct:</b> Lord Wellesley, an aggressive imperialist, arrived with the Subsidiary Alliance system. Tipu's refusal to become a subservient vassal and his ongoing correspondence with the French (Napoleon) served as the pretext for the final war (1799) where Tipu died fighting."
            },
            {
                q: "Identify the historical personality based on the following clues:\n<br><br>- He belonged to the fiercely independent Rohilla Afghan tribe.\n<br>- He served as the Mir Bakhshi (Paymaster General) of the Mughal Empire.\n<br>- He was appointed as the supreme dictator of Delhi by Ahmad Shah Abdali after the sack of the city.\n<br>- He successfully defended his territory against the Maratha leader Dattaji Scindia but later fought alongside Abdali at Panipat.\n<br><br>Select the correct personality:",
                options: ["Hafiz Rahmat Khan", "Najib-ud-Daula", "Shuja-ud-Daula", "Zulfiqar Khan"],
                answer: 1,
                exp: "<b>Answer: Najib-ud-Daula</b><br><br>Najib-ud-Daula was a prominent Rohilla chief. He became incredibly powerful in North India, acting as Ahmad Shah Abdali's primary agent and 'Mir Bakhshi' in Delhi. He harbored intense enmity towards the Marathas, who constantly raided his territory. His diplomatic efforts were crucial in allying the Awadh Nawab with Abdali, leading to the devastating Maratha defeat at the Third Battle of Panipat (1761)."
            },
            {
                q: "Consider the following statements regarding the early organizational structure of the English East India Company in India (pre-1773):\n<br><br>1. The Governor of Bengal possessed overriding veto powers over the Presidencies of Madras and Bombay to ensure unified military strategy.\n<br>2. The Company's servants were paid nominally but were officially permitted to engage in private inland trade to supplement their income.\n<br>3. The Court of Directors in London maintained strict oversight, successfully preventing the widespread corruption of 'nabobs'.\n<br><br>How many of the above statements are correct?",
                options: ["Only one", "Only two", "All three", "None"],
                answer: 0,
                exp: "<b>Answer: Only one</b><br><br><b>Statement 1 is incorrect:</b> Before the Regulating Act of 1773, the three Presidencies (Bengal, Madras, Bombay) were entirely independent of each other and reported directly to London. This lack of coordination often led to conflicting policies (e.g., Bombay fighting Marathas while Bengal sought peace).<br><b>Statement 2 is correct:</b> The EIC paid terrible salaries. To compensate, it officially permitted its servants to engage in private trade. This system eventually led to massive exploitation of Indian artisans and merchants.<br><b>Statement 3 is incorrect:</b> The Court of Directors completely failed to curb corruption. The returning Company officials (derisively called 'Nabobs') brought back fabulous wealth plundered from India, which actually corrupted British politics and forced Parliament to intervene (1773)."
            },
            {
                q: "With reference to the agrarian crisis of the late Mughal Empire, what was the primary feature of the 'Ijara' system?\n<br><br>1. It involved the state directly assessing and collecting revenue from the individual peasant (ryot) without intermediaries.\n<br>2. It was a system of revenue farming where the right to collect taxes was auctioned to the highest bidder.\n<br>3. It mandated that the revenue be paid strictly in kind (produce) to protect the peasantry from currency fluctuations.\n<br><br>Select the correct statement/s:",
                options: ["1 only", "2 only", "1 and 3 only", "1, 2 and 3"],
                answer: 1,
                exp: "<b>Answer: 2 only</b><br><br><b>Statement 1 is incorrect:</b> That describes the Ryotwari or Zabt system, which the Ijara system actively undermined.<br><b>Statement 2 is correct:</b> The Ijara system (revenue farming) became rampant in the 18th century. As the state apparatus weakened, the government or jagirdars auctioned the revenue collection rights to contractors (Ijaradars). These contractors had no long-term interest in the land and ruthlessly squeezed the peasantry for maximum short-term profit.<br><b>Statement 3 is incorrect:</b> The demand was fixed in cash, which further burdened the peasantry who had to sell their crops at distress prices."
            },
            {
                q: "Assertion (A): The advent of European trading companies in the 16th and 17th centuries immediately destroyed the traditional Indian artisan and weaving communities.<br><br>Reason (R): European companies flooded the Indian market with cheaper, machine-made goods produced during the Industrial Revolution.<br><br>In the context of the above, which of the following is correct?",
                options: [
                    "Both A and R are true and R is the correct explanation of A.",
                    "Both A and R are true but R is not the correct explanation of A.",
                    "A is true but R is false.",
                    "A is false but R is true.",
                    "Both A and R are false."

                answer: 4,
                exp: "<b>Answer: Both A and R are false.</b><br><br><b>Assertion is false:</b> In the 16th/17th centuries (pre-colonial phase), the arrival of European companies actually <i>benefited</i> Indian artisans. The Europeans aggressively competed with each other to buy Indian textiles and spices, injecting massive amounts of bullion (silver/gold) into the economy and expanding the global market for Indian weavers.<br><b>Reason is false:</b> The Industrial Revolution did not occur until the late 18th/19th century. During the 16th/17th centuries, Europe did not have machine-made goods to flood India. The destruction (de-industrialization) of Indian artisans happened <i>later</i>, in the 19th century, under British colonial policy."
            },
            {
                q: "Consider the following statements regarding the administration of the Peshwas in the 18th century:\n<br><br>1. The 'Huzur Daftar' situated in Poona was the central secretariat that kept meticulous records of all revenue collections and military grants.\n<br>2. The Kamavisdar was the chief executive officer at the provincial level, completely independent of the central Peshwa authority.\n<br>3. Justice in the rural areas was dispensed primarily through the 'Panchayat', while the 'Nyayadhish' handled matters strictly related to the royal household.\n<br><br>How many of the above statements are correct?",
                options: ["Only one", "Only two", "All three", "None"],
                answer: 0,
                exp: "<b>Answer: Only one</b><br><br><b>Statement 1 is correct:</b> The 'Huzur Daftar' at Poona (Pune) under the Peshwas was a massive, highly organized central secretariat containing records of all treaties, revenues, and alienations (grants).<br><b>Statement 2 is incorrect:</b> The Kamavisdar (or Mamlatdar) was the Peshwa's representative at the district/provincial level. However, they were strictly monitored by the central government through a system of checks, balances, and periodic audits, not independent.<br><b>Statement 3 is incorrect:</b> While the Panchayat handled rural justice, the 'Nyayadhish' was the Chief Justice of the entire Maratha Empire based on Hindu scriptures (Smritis), not just the royal household."
            },
            {
                q: "Assertion (A): Nadir Shah’s invasion (1739) caused irreparable damage to the Mughal Empire, far beyond the mere plundering of Delhi's wealth.\n<br><br>Reason (R): The invasion exposed the complete military vulnerability of the empire, resulting in the permanent loss of Kabul and trans-Indus territories, which stripped India of its strategic natural frontier defense.\n<br><br>In the context of the above, which of the following is correct?",
                options: [

                answer: 0,
                exp: "<b>Answer: Both A and R are true and R is the correct explanation of A.</b><br><br>Nadir Shah’s invasion was devastating not just for the loot (the Peacock Throne, Koh-i-Noor, and millions in cash) but because he forced the Mughal Emperor to cede all territories west of the river Indus (including Kabul, Ghazni, and Sindh). This dismantled the empire's traditional north-western defense line, leaving the plains of India entirely vulnerable to subsequent repeated invasions by Ahmad Shah Abdali."
            },
            {
                q: "With reference to the Maratha Navy in the 18th century, consider the following statements:\n<br><br>1. Kanhoji Angre developed a formidable naval fleet that successfully challenged the maritime supremacy of the British, Portuguese, and Siddis along the Konkan coast.\n<br>2. The Maratha navy was characterized by heavily armed, deep-water galleons built strictly on the European model.\n<br>3. Following the death of Kanhoji Angre, the Maratha naval power was completely absorbed by the English East India Company through a peaceful subsidiary alliance.\n<br><br>How many of the above statements are correct?",
                options: ["Only one", "Only two", "All three", "None"],
                answer: 0,
                exp: "<b>Answer: Only one</b><br><br><b>Statement 1 is correct:</b> Kanhoji Angre (Sarkhel) built a powerful Maratha navy base at Vijaydurg and Kolaba, successfully extracting chauth from European ships and defending the Konkan coastline from the Portuguese, British, and Siddis of Janjira.<br><b>Statement 2 is incorrect:</b> The Marathas used smaller, highly maneuverable coastal vessels (like Galivs and Gurabs) rather than large, deep-water European galleons. This gave them an advantage in the shallow creeks of the Konkan coast, though they lacked deep-ocean firepower.<br><b>Statement 3 is incorrect:</b> After Kanhoji's death, internal rivalries weakened the Angre clan. The British and the Peshwa (Balaji Baji Rao) actually formed a joint alliance to attack and destroy the Angre naval base at Vijaydurg in 1756."
            },
            {
                q: "Consider the following statements regarding the agrarian class structure in the 18th century:\n<br><br>1. 'Khud-kasht' peasants were migratory cultivators who farmed lands in other villages on a contractual basis.\n<br>2. 'Pahi-kasht' peasants possessed hereditary occupancy rights and owned their own ploughs and bullocks.\n<br>3. The state generally favored the expansion of Pahi-kasht cultivation to bring wasteland under the plough and increase revenue.\n<br><br>How many of the above statements are correct?",
                options: ["Only one", "Only two", "All three", "None"],
                answer: 0,
                exp: "<b>Answer: Only one</b><br><br><b>Statement 1 is incorrect:</b> 'Khud-kasht' were the resident peasants who cultivated their own land in their own village. They held hereditary occupancy rights and were the socially dominant cultivators.<br><b>Statement 2 is incorrect:</b> 'Pahi-kasht' were non-resident or migratory cultivators who farmed land in villages other than their own, often on less favorable terms. They did not hold hereditary occupancy rights.<br><b>Statement 3 is correct:</b> The state encouraged the movement of Pahi-kasht peasants to cultivate unutilized lands or abandoned villages, as it increased the total agrarian tax base."
            },
            {
                q: "Consider the following statements regarding the socio-cultural institution of Slavery in 18th-century India:\n<br><br>1. Slavery was predominantly agrarian, with large-scale plantations relying heavily on slave labor akin to the contemporary Americas.\n<br>2. The European trading companies actively participated in the purchase and export of Indian slaves to their colonies in Southeast Asia.\n<br>3. Slaves in the royal courts could sometimes attain high administrative or military ranks, reflecting a fluid social mobility absent in Western chattel slavery.\n<br><br>How many of the above statements are correct?",
                options: ["Only one", "Only two", "All three", "None"],
                answer: 1,
                exp: "<b>Answer: Only two</b><br><br><b>Statement 1 is incorrect:</b> Unlike the Americas, slavery in 18th-century India was largely domestic, not agrarian. Slaves were employed in households for menial work, as concubines, or in royal entourages; large slave-run agricultural plantations were virtually non-existent.<br><b>Statement 2 is correct:</b> European companies (especially the Portuguese and the Dutch) heavily engaged in the slave trade, buying slaves from Bengal and the Coromandel Coast during famines and exporting them to Batavia (Indonesia) and Ceylon.<br><b>Statement 3 is correct:</b> Elite military slavery (often Habshis/Abyssinians or captured individuals) existed in royal courts. Unlike chattel slavery, military slaves could become powerful nobles or generals."
            },
            {
                q: "Which of the following events was the immediate catalyst for the Battle of Wandiwash (1760)?\n<br><br>1. The capture of the French settlement of Chandernagore by Robert Clive.\n<br>2. The arrival of Count de Lally in India with explicit orders from the French government to aggressively expel the British.\n<br>3. The succession dispute in Hyderabad between Nasir Jung and Muzaffar Jung.\n<br><br>Select the correct option:",
                options: ["1 only", "2 only", "1 and 3 only", "1, 2 and 3"],
                answer: 1,
                exp: "<b>Answer: 2 only</b><br><br>The Battle of Wandiwash was part of the Third Carnatic War. The immediate catalyst for the renewed hostilities in the south was the arrival of the impetuous French General, Count de Lally. Lally aggressively attacked British forts (taking Fort St. David) but eventually exhausted his funds and alienated his Indian allies. Sir Eyre Coote decisively defeated Lally at Wandiwash, effectively ending French imperial ambitions in India. (Chandernagore's capture happened earlier in Bengal; the Hyderabad succession triggered the *Second* Carnatic War)."
            },
            {
                q: "Consider the following statements regarding the Kingdom of the Jats under Suraj Mal in the 18th century:\n<br><br>1. The state was heavily reliant on the pre-existing Mughal administrative structures for revenue collection.\n<br>2. Suraj Mal adopted a policy of complete isolationism, abstaining from interference in the politics of the Mughal court and the Marathas.\n<br>3. The architectural zenith of the Jat kingdom was realized in the construction of the garden-palace complex at Deeg.\n<br><br>How many of the above statements are correct?",
                options: ["Only one", "Only two", "All three", "None"],
                answer: 1,
                exp: "<b>Answer: Only two</b><br><br><b>Statement 1 is correct:</b> The Jat state under Suraj Mal did not invent a new administration; they effectively utilized the existing Mughal revenue and administrative apparatus (Zabt system) to extract surplus for their military.<br><b>Statement 2 is incorrect:</b> Suraj Mal was a master diplomat who actively intervened in Delhi's politics. He formed strategic, shifting alliances with the Nawab of Awadh, the Marathas, and the Mughal Emperor to expand his territory (capturing Agra).<br><b>Statement 3 is correct:</b> The magnificent palaces of Deeg, which brilliantly synthesized Mughal and Rajput architectural elements, were built by Suraj Mal and are a testament to the prosperity of the Jat state."
            },
            {
                q: "With reference to the Treaty of Allahabad (1765), which of the following provisions directly altered the constitutional status of the English East India Company?\n<br><br>1. The Company agreed to pay an annual tribute of 26 lakhs to the Mughal Emperor.\n<br>2. The Nawab of Awadh surrendered the districts of Kora and Allahabad to the Mughal Emperor.\n<br>3. The Mughal Emperor issued a Farman granting the Diwani of Bengal, Bihar, and Orissa to the Company in perpetuity.\n<br><br>Select the correct statement/s:",
                options: ["1 only", "3 only", "2 and 3 only", "1, 2 and 3"],
                answer: 1,
                exp: "<b>Answer: 3 only</b><br><br>While all statements reflect provisions of the treaties signed at Allahabad, the constitutional game-changer for the EIC was the grant of Diwani (Statement 3). By officially acquiring the right to collect revenue (Diwani) from the Mughal Emperor, the EIC transformed from a mere trading corporation into a recognized territorial and administrative entity within the Mughal constitutional framework. Paying the tribute (Statement 1) was a condition of this grant, but the *grant itself* altered their status."
            },
            {
                q: "Assertion (A): The English East India Company emerged victorious in India because they enjoyed total monopoly over the Eastern trade without any domestic British competition.\n<br><br>Reason (R): The British Parliament systematically barred private British merchants from challenging the Company's monopoly until the Charter Act of 1813.\n<br><br>In the context of the above, which of the following is correct?",
                options: [

                answer: 3,
                exp: "<b>Answer: A is false but R is true.</b><br><br><b>Assertion is false:</b> The EIC did *not* enjoy a total, unchallenged monopoly originally. In the late 17th and early 18th century, they faced fierce domestic competition from a rival group of merchants ('Interlopers') who even formed a 'New Company'. The two companies fought bitterly before eventually merging in 1708 (creating the United Company). Their victory in India was due to corporate structure, naval power, and Bengal revenues, not an initial lack of domestic rivalry.<br><b>Reason is true:</b> After the 1708 merger, the United Company's monopoly was legally enforced by Parliament, preventing British free merchants from trading with India until the monopoly was finally abolished in 1813."
            },
            {
                q: "Consider the following statements regarding the economic shift in India from the early 18th century to the late 18th century (post-Plassey):\n<br><br>1. The traditional overland trade routes through Central Asia were completely abandoned due to the rise of European maritime dominance.\n<br>2. There was a dramatic reversal in the flow of bullion; India transitioned from a net importer to a net exporter of wealth.\n<br>3. The East India Company ceased the importation of British manufactured goods, relying entirely on Indian revenues to purchase Indian textiles.\n<br><br>How many of the above statements are correct?",
                options: ["Only one", "Only two", "All three", "None"],

                exp: "<b>Answer: Only two</b><br><br><b>Statement 1 is incorrect:</b> While maritime trade grew significantly, overland trade through the Northwest (via Afghanistan to Central Asia and Persia) continued to be substantial throughout the 18th century, managed by Khatri and Afghan merchants.<br><b>Statement 2 is correct:</b> Pre-Plassey, Europe paid for Indian goods with silver bullion. Post-Plassey, the 'Drain of Wealth' began; Indian tax revenues were used to buy Indian goods for export, draining the country's wealth.<br><b>Statement 3 is correct:</b> After acquiring the Diwani of Bengal (1765), the Company used the massive land revenue to finance its 'investments' (purchasing Indian goods for export), completely ending the need to bring bullion or British goods to India."
            },
            {
                q: "Identify the European settlement based on the following characteristics:\n<br><br>- It was the primary headquarters of the Dutch East India Company in India before they shifted to Negapatam.\n<br>- It was a major center for the procurement of Coromandel textiles, which were traded for spices in the East Indies.\n<br>- The settlement was heavily fortified by the Dutch with the construction of Fort Geldria.\n<br><br>Select the correct settlement:",
                options: ["Masulipatnam", "Pulicat", "Chinsurah", "Tranquebar"],

                exp: "<b>Answer: Pulicat</b><br><br>Pulicat (Pazhaverkadu) in Tamil Nadu was the main headquarters of the Dutch East India Company (VOC) on the Coromandel coast until 1690 (when it shifted to Negapatam). They built Fort Geldria there. It was crucial for their strategy of buying Indian cotton textiles to exchange for spices in the Indonesian archipelago (Spice Islands). Masulipatnam was an early factory, Chinsurah was in Bengal, and Tranquebar was a Danish settlement."
            },
            {
                q: "Consider the following statements regarding the Maratha relations with the Rajput states in the 18th century:\n<br><br>1. The Marathas acted as a stabilizing force, mediating succession disputes in Mewar and Marwar to ensure regional peace.\n<br>2. The rampant exaction of 'Chauth' by Maratha commanders severely depleted Rajputana's economy, turning the Rajputs completely against the Marathas.\n<br>3. Sawai Jai Singh of Amber formally aligned with the Peshwa to overthrow the Mughal Emperor in Delhi.\n<br><br>How many of the above statements are correct?",

            },
            {
                q: "Consider the following statements regarding the art of Miniature Painting in the 18th century:\n<br><br>1. The Kishangarh school emerged as a distinct style, characterized by highly stylized facial features and profound Vaishnavite devotional themes.\n<br>2. The migration of artists from the declining Mughal capital resulted in a complete homogenization of the Rajput painting styles.\n<br>3. The famous painting of 'Bani Thani' is an epitome of the Kangra style of painting patronized by Raja Sansar Chand.\n<br><br>How many of the above statements are correct?",

            },
            {
                q: "Assertion (A): The 'Black Hole Tragedy' of Calcutta (1756) is universally accepted by modern historians as the primary structural cause for the English conquest of Bengal.\n<br><br>Reason (R): The event conclusively proved Siraj-ud-Daula's inherently cruel disposition, uniting all factions of the Bengal nobility with the British to depose him.\n<br><br>In the context of the above, which of the following is correct?",
                options: [

            },
            {
                q: "Which of the following developments best explains the decline of Surat and the rise of Bombay as a commercial center in the 18th century?\n<br><br>1. The silting of the Tapi River rendered Surat completely inaccessible to maritime shipping.\n<br>2. The continuous Maratha raids and political instability in Gujarat destroyed Surat's manufacturing hinterland.\n<br>3. The English East India Company systematically transferred indigenous merchants and capital to Bombay through security guarantees.\n<br><br>Select the correct statement/s:",
                options: ["1 and 2 only", "2 and 3 only", "3 only", "1, 2 and 3"],

                exp: "<b>Answer: 2 and 3 only</b><br><br><b>Statement 1 is incorrect:</b> While some silting occurred, Surat did not become 'completely inaccessible'. It remained a viable port, but lost its primacy to Bombay due to political and economic factors.<br><b>Statement 2 is correct:</b> The decline of the Mughal Empire meant Surat lost its protection. Maratha raids (beginning with Shivaji) and subsequent conflicts disrupted the trade routes linking Surat to its hinterland.<br><b>Statement 3 is correct:</b> Bombay was an island fortress, protected by the British Navy. The EIC deliberately enticed wealthy indigenous merchants (Parsis, Banias) to migrate from insecure Surat to Bombay by promising physical security, religious freedom, and predictable commercial laws."
            },
            {
                q: "Consider the following statements regarding the early British administrative and legal structures in India (pre-1800):\n<br><br>1. Warren Hastings established a system of civil courts (Diwani Adalats) that strictly applied English Common Law to both Hindus and Muslims.\n<br>2. The establishment of the Calcutta Madrasa and the Asiatic Society of Bengal reflected an Orientalist policy of governing Indians through their own laws and customs.\n<br>3. The Regulating Act of 1773 established the Supreme Court at Calcutta, which created immense jurisdictional friction with the Company’s established provincial courts.\n<br><br>How many of the above statements are correct?",
                options: ["Only one", "Only two", "All three", "None"],
                answer: 1,
                exp: "<b>Answer: Only two</b><br><br><b>Statement 1 is incorrect:</b> Warren Hastings did not apply English Common Law to Indians. In civil matters (marriage, inheritance), his courts applied Hindu Law for Hindus (translated by Halhed) and Islamic Law for Muslims. He relied on native Pundits and Maulvis to interpret these laws.<br><b>Statement 2 is correct:</b> The Orientalist phase (Hastings, William Jones) believed in understanding and preserving Indian culture. The Asiatic Society (1784) and Calcutta Madrasa (1781) were founded to study local traditions to aid governance.<br><b>Statement 3 is correct:</b> The Supreme Court set up by the 1773 Act applied English law. Its jurisdiction was poorly defined, leading to massive clashes with the EIC's own Adalat system over who had authority over the Zamindars and revenue officials."
            },
            {
                q: "With reference to the Treaty of Srirangapatna (1792) concluding the Third Anglo-Mysore War, consider the following statements:\n<br><br>1. Tipu Sultan was forced to cede half of his territorial dominions to the victorious British alliance.\n<br>2. The ceded territories were equally partitioned exclusively between the English East India Company and the Marathas.\n<br>3. Tipu Sultan was forced to surrender two of his sons as hostages to Lord Cornwallis pending the payment of a massive war indemnity.\n<br><br>How many of the above statements are correct?",

                exp: "<b>Answer: Only two</b><br><br><b>Statement 1 is correct:</b> The treaty was disastrous for Mysore. Tipu lost half his territory, drastically reducing his economic and military base.<br><b>Statement 2 is incorrect:</b> The territory was partitioned among *three* allies: The British, the Marathas, and the Nizam of Hyderabad. (The British took strategic areas like Malabar, Dindigul, and Baramahal).<br><b>Statement 3 is correct:</b> A massive war indemnity of 3.3 crore rupees was levied. Since Tipu could not pay immediately, two of his sons were taken as hostages by Cornwallis to ensure compliance."
            },
            {
                q: "Consider the following statements regarding the socio-political status of women in 18th-century India:\n<br><br>1. Ahilyabai Holkar of Indore personally led armies into battle and administered a highly prosperous state for three decades.\n<br>2. The practice of Sati was universal and strictly enforced by law across all regions and castes in the Indian subcontinent.\n<br>3. Property rights for women were entirely non-existent under both the Dayabhaga and Mitakshara schools of Hindu law.\n<br><br>How many of the above statements are correct?",

            },
            {
                q: "Analyze the role of indigenous financing in the British conquest of India. Which of the following statements is historically accurate?\n<br><br>1. The British East India Company strictly barred Indian bankers from participating in their war loans to maintain financial independence.\n<br>2. Prominent banking houses like the Jagat Seths in Bengal actively conspired with the British to overthrow the Nawab.\n<br>3. The sophisticated network of Indian 'Hundis' (bills of exchange) was utilized by the British to seamlessly transfer military funds across the subcontinent during their campaigns.\n<br><br>How many of the above statements are correct?",
                options: ["Only one", "Only two", "All three", "None"],

            {
                q: "Consider the following statements regarding the 'Dual Government' (1765-1772) in Bengal:\n<br><br>1. It resulted in a catastrophic decline in agriculture, culminating in the Bengal Famine of 1770.\n<br>2. The Company servants maximized revenue extraction by abolishing the indigenous posts of Deputy Diwans (Naib Diwans).\n<br>3. The system was finally abolished by Lord Cornwallis upon his arrival as Governor-General.\n<br><br>How many of the above statements are correct?",

        // UI State Variables
        let currentQ = 0;
        let selectedAnswers = new Array(questions.length).fill(null);

        qStatus[0] = 'not-ans'; // First question visited automatically

        // Timer Logic (2 Hours)
        let timeRemaining = 7200; 
        const timerElement = document.getElementById('timer');

        setInterval(() => {
            if(timeRemaining <= 0) {
                submitExam();
                return;
            }
            timeRemaining--;
            let h = Math.floor(timeRemaining / 3600);
            let m = Math.floor((timeRemaining % 3600) / 60);
            let s = timeRemaining % 60;
            timerElement.innerText = 
                (h < 10 ? "0"+h : h) + ":" + 
                (m < 10 ? "0"+m : m) + ":" + 
                (s < 10 ? "0"+s : s);
        }, 1000);

        // Initialize Exam
        function init() {
            document.getElementById('q-counter').innerText = `Question 1 of ${questions.length}`;
            renderPalette();
            renderQuestion();
        }

        function renderPalette() {
            const grid = document.getElementById('palette-grid');
            grid.innerHTML = '';
            for(let i=0; i<questions.length; i++) {
                const btn = document.createElement('button');
                btn.className = `q-btn ${qStatus[i]}`;
                btn.innerText = i + 1;
                btn.onclick = () => jumpToQuestion(i);
                grid.appendChild(btn);
            }
        }

        function renderQuestion() {
            const q = questions[currentQ];
            document.getElementById('q-counter').innerText = `Question ${currentQ + 1} of ${questions.length}`;
            document.getElementById('q-text').innerHTML = q.q;

            const optContainer = document.getElementById('options-container');
            optContainer.innerHTML = '';

            q.options.forEach((optText, index) => {
                const label = document.createElement('label');
                label.className = 'option-label';
                
                const input = document.createElement('input');
                input.type = 'radio';
                input.name = 'option';
                input.value = index;
                
                // Restore selected answer if exists
                if(selectedAnswers[currentQ] === index) {
                    input.checked = true;
                }

                input.onchange = () => {
                    selectedAnswers[currentQ] = index;
                };

                label.appendChild(input);
                label.appendChild(document.createTextNode(optText));
                optContainer.appendChild(label);
            });
        }

        function jumpToQuestion(index) {
            updateStatusBeforeLeaving();
            currentQ = index;
            if(qStatus[currentQ] === 'not-vis') {
                qStatus[currentQ] = 'not-ans';
            }
            renderQuestion();
            renderPalette();
        }

        function updateStatusBeforeLeaving() {
            // Only update if it wasn't marked
            if(qStatus[currentQ] !== 'marked' && qStatus[currentQ] !== 'marked-ans') {
                if(selectedAnswers[currentQ] !== null) {
                    qStatus[currentQ] = 'ans';
                } else {
                    qStatus[currentQ] = 'not-ans';
                }
            } else if (qStatus[currentQ] === 'marked' && selectedAnswers[currentQ] !== null) {
                // If user selected something while it was marked
                qStatus[currentQ] = 'marked-ans';
            }
        }

        function prevQuestion() {
            if(currentQ > 0) jumpToQuestion(currentQ - 1);
        }

        function saveAndNext() {
            if(selectedAnswers[currentQ] !== null) {
                qStatus[currentQ] = 'ans';
            } else {
                qStatus[currentQ] = 'not-ans';
            }
            if(currentQ < questions.length - 1) {
                currentQ++;
                if(qStatus[currentQ] === 'not-vis') qStatus[currentQ] = 'not-ans';
                renderQuestion();
                renderPalette();
            } else {
                renderPalette();
            }
        }

        function markForReview() {
            if(selectedAnswers[currentQ] !== null) {
                qStatus[currentQ] = 'marked-ans';
            } else {
                qStatus[currentQ] = 'marked';
            }
            if(currentQ < questions.length - 1) {
                currentQ++;
                if(qStatus[currentQ] === 'not-vis') qStatus[currentQ] = 'not-ans';
                renderQuestion();
                renderPalette();
            } else {
                renderPalette();
            }
        }

            let wrong = 0;
            let attempted = 0;

                const userAns = selectedAnswers[i];

                if(userAns !== null) {

                    // Both 'ans' and 'marked-ans' are evaluated

                        statusClass = 'exp-correct';

                    }

                expDiv.className = `exp-item ${statusClass}`;
                expDiv.innerHTML = `
                    <h4>Q${i+1}: ${q.q.replace(/<br>/g, '')}</h4>
                    <p style="margin-top:10px; color:#64748b;">Your Answer: ${userAns !== null ? q.options[userAns] : 'Not Attempted'}</p>

                expContainer.appendChild(expDiv);
            });

            const marks = (correct * 2) - (wrong * 0.66);
            const accuracy = attempted === 0 ? 0 : ((correct/attempted)*100).toFixed(2);

            document.getElementById('score-val').innerText = marks.toFixed(2);
            document.getElementById('acc-val').innerText = accuracy + '%';
            document.getElementById('att-val').innerText = attempted;
        }

        // Start
        init();
    </script>
</body>
</html>
